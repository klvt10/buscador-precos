<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Buscador de Passagens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="barra" id="barra" hidden>
    <a href="#/alertas" class="marca">✈️ Buscador de Passagens</a>
    <nav>
      <a href="#/alertas">Alertas</a>
      <a href="#/conta" id="link-conta">Conta</a>
      <button class="btn fantasma" id="btn-sair">Sair</button>
    </nav>
  </header>

  <main id="tela" aria-live="polite"></main>

  <!-- Telas de acesso -->
  <template id="t-entrar">
    <section class="acesso">
      <form class="card form-acesso" data-form="entrar">
        <h1>Entrar</h1>
        <label>Celular (WhatsApp) <input name="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(51) 99999-9999" required></label>
        <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
        <label class="check"><input type="checkbox" name="lembrar" checked> Lembrar este aparelho por 30 dias</label>
        <button class="btn primario" type="submit">Entrar</button>
        <p class="erro" data-erro role="alert"></p>
        <p class="links"><a href="#/esqueci">Esqueci a senha</a> · <a href="#/cadastro">Criar conta</a></p>
      </form>
    </section>
  </template>

  <template id="t-cadastro">
    <section class="acesso">
      <form class="card form-acesso" data-form="cadastro">
        <h1>Criar conta</h1>
        <p class="nota">Um código chega no seu WhatsApp para confirmar o número. Os alertas de preço também chegam por lá.</p>
        <label>Nome <input name="nome" autocomplete="name" maxlength="60" required></label>
        <label>Celular (WhatsApp) <input name="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(51) 99999-9999" required></label>
        <label>Senha (mín. 8 caracteres) <input name="senha" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn primario" type="submit">Criar conta</button>
        <p class="erro" data-erro role="alert"></p>
        <p class="links">Já tem conta? <a href="#/entrar">Entrar</a></p>
      </form>
    </section>
  </template>

  <template id="t-codigo">
    <section class="acesso">
      <form class="card form-acesso" data-form="codigo">
        <h1>Código do WhatsApp</h1>
        <p class="nota">Enviado para <strong data-tel></strong>. Vale por 10 minutos.</p>
        <label>Código de 6 dígitos <input name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" maxlength="6" required></label>
        <label data-nova-senha hidden>Senha nova (mín. 8 caracteres) <input name="senha" type="password" autocomplete="new-password" minlength="8"></label>
        <button class="btn primario" type="submit">Confirmar</button>
        <p class="erro" data-erro role="alert"></p>
        <p class="links"><button type="button" class="link" data-reenviar>Reenviar código</button> · <a href="#/entrar">Voltar</a></p>
      </form>
    </section>
  </template>

  <template id="t-esqueci">
    <section class="acesso">
      <form class="card form-acesso" data-form="esqueci">
        <h1>Esqueci a senha</h1>
        <p class="nota">Se houver conta com este número, um código chega no WhatsApp para criar uma senha nova.</p>
        <label>Celular (WhatsApp) <input name="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(51) 99999-9999" required></label>
        <button class="btn primario" type="submit">Enviar código</button>
        <p class="erro" data-erro role="alert"></p>
        <p class="links"><a href="#/entrar">Voltar</a></p>
      </form>
    </section>
  </template>

  <!-- Lista de alertas -->
  <template id="t-alertas">
    <section class="conteudo">
      <div class="topo">
        <div>
          <h1>Meus alertas</h1>
          <p class="sub" data-limite></p>
        </div>
        <a class="btn primario" href="#/novo" data-novo>Novo alerta</a>
      </div>
      <div class="lista" data-lista></div>
    </section>
  </template>

  <!-- Formulário de alerta (novo e edição) -->
  <template id="t-form-alerta">
    <form class="card" data-form="alerta">
      <h2 data-titulo>Novo alerta</h2>
      <div class="campos">
        <label class="largo">Nome (opcional) <input name="nome" maxlength="40" placeholder="Ex.: Natal em Brasília"></label>
        <label>Origem <input name="origem" maxlength="3" placeholder="POA" required></label>
        <label>Destino <input name="destino" maxlength="3" placeholder="BSB" required></label>
        <label>Ida <input type="date" name="data_ida" required></label>
        <label>Volta (vazio = só ida) <input type="date" name="data_volta"></label>
        <label>Alerta abaixo da média (%) <input type="number" name="desconto_pct" min="1" max="90" step="1" value="15" required></label>
        <label>Pesquisar a cada (min) <input type="number" name="intervalo_min" min="5" max="1440" step="1" value="20" required></label>
      </div>
      <label class="check"><input type="checkbox" name="ativo" checked> Alerta ligado</label>
      <p class="nota">Só voos diretos, 1 adulto, econômica. Códigos de aeroporto com 3 letras (POA, GRU, CGH, BSB, GIG…). Sites com proteção antirrobô são consultados no máximo a cada 30 minutos; os demais seguem o intervalo escolhido. Trocar rota ou datas começa uma média nova.</p>
      <div class="linha-botao">
        <button type="submit" class="btn primario">Salvar</button>
        <a class="btn fantasma" data-cancelar href="#/alertas">Cancelar</a>
        <span class="msg" data-msg role="status"></span>
      </div>
    </form>
  </template>

  <!-- Detalhe de um alerta -->
  <template id="t-detalhe">
    <section class="conteudo">
      <div class="topo">
        <div>
          <p class="sub"><a href="#/alertas">← Meus alertas</a></p>
          <h1 data-titulo>—</h1>
          <p class="sub" data-sub></p>
        </div>
        <div class="acoes">
          <button class="btn" data-pesquisar>Pesquisar agora</button>
          <button class="btn" data-ligar></button>
        </div>
      </div>

      <div class="kpis">
        <div class="card kpi"><span class="rotulo">Última consulta</span><strong data-k="ultima">—</strong><span class="detalhe" data-k="ultima-det"></span></div>
        <div class="card kpi"><span class="rotulo">Média móvel 7 dias</span><strong data-k="media">—</strong><span class="detalhe" data-k="media-det"></span></div>
        <div class="card kpi"><span class="rotulo">Gatilho do alerta</span><strong data-k="gatilho">—</strong><span class="detalhe" data-k="gatilho-det"></span></div>
        <div class="card kpi"><span class="rotulo">Menor total já visto</span><strong data-k="minimo">—</strong><span class="detalhe" data-k="minimo-det"></span></div>
      </div>

      <div class="card">
        <div class="card-topo">
          <h2 data-titulo-grafico>Total</h2>
          <div class="segmentado" data-periodo>
            <button data-dias="3">3 d</button>
            <button data-dias="7">7 d</button>
            <button data-dias="30" class="ativo">30 d</button>
            <button data-dias="365">Tudo</button>
          </div>
        </div>
        <div class="grafico"><canvas></canvas></div>
        <p class="vazio" data-grafico-vazio hidden>Ainda não há consultas. A primeira sai em poucos minutos.</p>
      </div>

      <div class="duas">
        <div class="card"><h2>Mais barato agora</h2><div data-voos></div></div>
        <div class="card"><h2>Fontes</h2><div data-fontes></div></div>
      </div>

      <div data-form-lugar></div>

      <div class="card perigo">
        <h2>Apagar alerta</h2>
        <p class="nota">Apaga o alerta e todo o histórico de consultas dele.</p>
        <button class="btn perigo" data-apagar>Apagar alerta</button>
      </div>
    </section>
  </template>

  <!-- Conta -->
  <template id="t-conta">
    <section class="conteudo estreito">
      <h1>Conta</h1>
      <form class="card" data-form="nome">
        <h2>Dados</h2>
        <label>Nome <input name="nome" maxlength="60" required></label>
        <p class="nota">Celular: <strong data-tel></strong></p>
        <div class="linha-botao"><button class="btn primario" type="submit">Salvar</button><span class="msg" data-msg></span></div>
      </form>
      <form class="card" data-form="senha">
        <h2>Trocar senha</h2>
        <label>Senha atual <input name="atual" type="password" autocomplete="current-password" required></label>
        <label>Senha nova (mín. 8 caracteres) <input name="nova" type="password" autocomplete="new-password" minlength="8" required></label>
        <div class="linha-botao"><button class="btn primario" type="submit">Trocar</button><span class="msg" data-msg></span></div>
      </form>
      <div class="card">
        <h2>Sessões</h2>
        <p class="nota">Sai deste e de todos os outros aparelhos. O próximo acesso pede código no WhatsApp.</p>
        <button class="btn" data-sair-todos>Sair de todos os aparelhos</button>
      </div>
      <div class="card" data-admin hidden>
        <h2>Operação</h2>
        <pre class="estado" data-estado></pre>
      </div>
      <form class="card perigo" data-form="apagar">
        <h2>Apagar conta</h2>
        <p class="nota">Apaga a conta, os alertas e o histórico. Não tem volta.</p>
        <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
        <div class="linha-botao"><button class="btn perigo" type="submit">Apagar conta</button><span class="msg" data-msg></span></div>
      </form>
    </section>
  </template>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
