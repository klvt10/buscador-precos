<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Buscador de Passagens</title>
  <meta name="color-scheme" content="light dark">
  <script src="/tema.js?v=728c87caaf"></script>
  <link rel="stylesheet" href="/style.css?v=dfcc04fa07">
</head>
<body>

    <symbol id="i-olho" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g></symbol>
    <symbol id="i-calendario" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></g></symbol>
    <symbol id="i-relogio" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g></symbol>
    <symbol id="i-sino" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a2 2 0 0 0 3.4 0"/></symbol>
    <symbol id="i-escala" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><path d="M7 12h3M14 12h3"/></g></symbol>
    <symbol id="i-tendencia" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
    <symbol id="i-alvo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></g></symbol>
    <symbol id="i-trofeu" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></symbol>
    <symbol id="i-sair" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-maleta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 12.5h18"/></g></symbol>
    <symbol id="i-pessoa" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g></symbol>
    <symbol id="i-estrela" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></symbol>
    <symbol id="i-estrela-cheia" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>

    <symbol id="i-metade" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M12 3.5a8.5 8.5 0 0 1 0 17z"/></symbol>
    <symbol id="i-casa" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M3 11l9-7 9 7M5 9.5V20h14V9.5M10 20v-5h4v5"/></symbol>
    <symbol id="i-pino" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></g></symbol>
    <symbol id="i-arquivo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></g></symbol>
    <symbol id="i-desfazer" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3.5 20.5l1.3-4A8.5 8.5 0 1 1 8 19.5z"/></symbol>
  </svg>

  <header class="barra" id="barra">
    <div class="barra-dentro">
      <a href="/passagens" class="marca">
        <span class="marca-logo"><svg><use href="#i-aviao" data-marca-icone/></svg></span>
        <span class="marca-nome">Buscador de Passagens</span>
      </a>
      <nav class="barra-nav" data-so-logado>
        <a href="/passagens" data-nav="passagens">Passagens</a>
        <a href="/empregos" data-nav="empregos">Empregos</a>
        <a href="/conta" data-nav="conta" aria-label="Conta"><svg class="ic nav-curto" aria-hidden="true"><use href="#i-pessoa"/></svg><span class="nav-longo">Conta</span></a>
        <a href="/admin" data-nav="admin" data-so-admin aria-label="Administração"><span class="nav-longo">Administração</span><span class="nav-curto" aria-hidden="true">Admin</span></a>
      </nav>
      <div class="barra-acoes">
        <button type="button" class="icone-btn" data-tema-botao aria-label="Mudar para o tema escuro" title="Mudar para o tema escuro">
          <svg class="so-claro"><use href="#i-lua"/></svg><svg class="so-escuro"><use href="#i-sol"/></svg>
        </button>
        <button type="button" class="btn fantasma pequeno" id="btn-sair" data-so-logado aria-label="Sair" title="Sair"><svg class="ic nav-curto" aria-hidden="true"><use href="#i-sair"/></svg><span class="nav-longo">Sair</span></button>
      </div>
    </div>
  </header>

  <main id="tela" aria-live="polite"></main>

  <!-- Moldura das telas de acesso: apresentação ao lado do formulário -->
  <template id="t-acesso">
    <section class="acesso">
      <aside class="acesso-hero">
        <div class="acesso-hero-dentro">
          <p class="acesso-selo"><svg><use href="#i-sino"/></svg> Alerta de preço de passagem</p>
          <h2>O aviso chega no WhatsApp quando a passagem fica barata.</h2>
          <ul class="acesso-lista">
            <li><svg><use href="#i-lupa"/></svg><span>Pesquisa em vários sites de passagem, sozinho, no intervalo escolhido.</span></li>
            <li><svg><use href="#i-tendencia"/></svg><span>Compara o total com a média dos últimos 7 dias.</span></li>
            <li><svg><use href="#i-zap"/></svg><span>Avisa quando o total cai abaixo do percentual definido.</span></li>
          </ul>
          <div class="acesso-bilhete" aria-hidden="true">
            <div><strong>POA</strong><span>Porto Alegre</span></div>
            <div class="acesso-bilhete-linha"><svg><use href="#i-aviao"/></svg></div>
            <div class="fim"><strong>LIS</strong><span>Lisboa</span></div>
            <p>R$ 3.636 <em>18 % abaixo da média</em></p>
          </div>
        </div>
      </aside>
      <div class="acesso-form" data-acesso-lugar></div>
    </section>
  </template>

  <template id="t-entrar">
    <form class="form-acesso" data-form="entrar">
      <div class="form-acesso-topo">
        <h1>Entrar</h1>
        <p class="sub">Use o celular cadastrado e a senha.</p>
      </div>
      <label class="campo"><span class="rotulo">Celular (WhatsApp)</span><input name="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(51) 99999-9999" required></label>
      <label class="campo"><span class="rotulo">Senha</span><span class="campo-senha"><input name="senha" type="password" autocomplete="current-password" required><button type="button" class="ver-senha" aria-label="Mostrar senha"><svg><use href="#i-olho"/></svg></button></span></label>
      <label class="check"><input type="checkbox" name="lembrar" checked> Lembrar este aparelho por 30 dias</label>
      <button class="btn primario grande" type="submit">Entrar</button>
      <p class="erro" data-erro role="alert"></p>
      <p class="links"><a href="/esqueci">Esqueci a senha</a><span aria-hidden="true">·</span><a href="/cadastro">Criar conta</a></p>
    </form>
  </template>

  <template id="t-cadastro">
    <form class="form-acesso" data-form="cadastro">
      <div class="form-acesso-topo">
        <h1>Criar conta</h1>
        <p class="sub">Um código chega no WhatsApp para confirmar o número. Os avisos de preço também chegam por lá.</p>
      </div>
      <label class="campo"><span class="rotulo">Nome</span><input name="nome" autocomplete="name" maxlength="60" required></label>
      <label class="campo"><span class="rotulo">Celular (WhatsApp)</span><input name="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(51) 99999-9999" required></label>
      <label class="campo"><span class="rotulo">Senha <span class="opcional">(mín. 8 caracteres)</span></span><span class="campo-senha"><input name="senha" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="ver-senha" aria-label="Mostrar senha"><svg><use href="#i-olho"/></svg></button></span></label>
      <button class="btn primario grande" type="submit">Criar conta</button>
      <p class="erro" data-erro role="alert"></p>
      <p class="links">Já tem conta? <a href="/entrar">Entrar</a></p>
    </form>
  </template>

  <template id="t-codigo">
    <form class="form-acesso" data-form="codigo">
      <div class="form-acesso-topo">
        <span class="form-acesso-icone"><svg><use href="#i-zap"/></svg></span>
        <h1>Código do WhatsApp</h1>
        <p class="sub">Enviado para <strong data-tel></strong>. Vale por 10 minutos.</p>
      </div>
      <label class="campo"><span class="rotulo">Código de 6 dígitos</span><input class="entrada-codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" maxlength="6" placeholder="000000" required></label>
      <label class="campo" data-nova-senha hidden><span class="rotulo">Senha nova <span class="opcional">(mín. 8 caracteres)</span></span><span class="campo-senha"><input name="senha" type="password" autocomplete="new-password" minlength="8"><button type="button" class="ver-senha" aria-label="Mostrar senha"><svg><use href="#i-olho"/></svg></button></span></label>
      <button class="btn primario grande" type="submit">Confirmar</button>
      <p class="erro" data-erro role="alert"></p>
      <p class="links"><button type="button" class="link" data-reenviar>Reenviar código</button><span aria-hidden="true">·</span><a href="/entrar">Voltar</a></p>
    </form>
  </template>

  <template id="t-esqueci">
    <form class="form-acesso" data-form="esqueci">
      <div class="form-acesso-topo">
        <h1>Esqueci a senha</h1>
        <p class="sub">Se houver conta com este número, um código chega no WhatsApp para criar uma senha nova.</p>
      </div>
      <label class="campo"><span class="rotulo">Celular (WhatsApp)</span><input name="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(51) 99999-9999" required></label>
      <button class="btn primario grande" type="submit">Enviar código</button>
      <p class="erro" data-erro role="alert"></p>
      <p class="links"><a href="/entrar">Voltar para entrar</a></p>
    </form>
  </template>

  <!-- Lista de alertas -->
  <template id="t-alertas">
    <section class="conteudo">
      <div class="topo">
        <div>
          <h1>Meus alertas</h1>
          <p class="sub" data-limite></p>
        </div>
        <a class="btn primario" href="/passagens/nova" data-novo><svg class="ic"><use href="#i-mais"/></svg>Novo alerta</a>
      </div>
      <div class="lista" data-lista></div>
    </section>
  </template>

  <!-- Formulário de alerta (novo e edição) -->
  <template id="t-form-alerta">
    <form class="form-alerta" data-form="alerta" novalidate>
      <div class="fa-principal">

        <section class="fa-bloco" aria-labelledby="fa-rota">
          <header class="fa-bloco-topo">
            <span class="fa-passo" aria-hidden="true">1</span>
            <h2 id="fa-rota" data-titulo>Rota</h2>
          </header>
          <div class="fa-opcoes">
            <div class="pilulas" role="radiogroup" aria-label="Tipo de viagem">
              <label><input type="radio" name="tipo" value="ida-volta" checked><span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>Ida e volta</span></label>
              <label><input type="radio" name="tipo" value="so-ida"><span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13l-4-4M18 12l-4 4"/></svg>Só ida</span></label>
            </div>
            <div class="pilulas" role="radiogroup" aria-label="Escalas">
              <label><input type="radio" name="voos" value="diretos" checked><span>Só diretos</span></label>
              <label><input type="radio" name="voos" value="escalas"><span>Com escalas</span></label>
            </div>
          </div>
          <div class="rota">
            <div class="campo-aeroporto" data-aeroporto="origem"></div>
            <button type="button" class="trocar" data-trocar aria-label="Inverter origem e destino" title="Inverter origem e destino">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v14l-3-3M17 20V6l3 3"/></svg>
            </button>
            <div class="campo-aeroporto" data-aeroporto="destino"></div>
          </div>
          <p class="fa-dica" data-dica-voos>Só voos sem escala. Em rotas longas ou internacionais, “Com escalas” costuma achar preço (e às vezes o único voo).</p>
        </section>

        <section class="fa-bloco" aria-labelledby="fa-datas">
          <header class="fa-bloco-topo">
            <span class="fa-passo" aria-hidden="true">2</span>
            <h2 id="fa-datas">Datas</h2>
            <span class="fa-selo" data-noites hidden></span>
          </header>
          <div class="datas">
            <div class="campo-data" data-campo-data="ida">
              <span class="rotulo">Ida</span>
              <input type="hidden" name="data_ida" required>
              <span class="campo-data-dia" data-dia="ida"></span>
            </div>
            <div class="campo-data" data-campo-data="volta" data-volta>
              <span class="rotulo">Volta</span>
              <input type="hidden" name="data_volta">
              <span class="campo-data-dia" data-dia="volta"></span>
            </div>
          </div>
        </section>

        <section class="fa-bloco" aria-labelledby="fa-aviso">
          <header class="fa-bloco-topo">
            <span class="fa-passo" aria-hidden="true">3</span>
            <h2 id="fa-aviso">Aviso no WhatsApp</h2>
          </header>
          <div class="fa-desconto">
            <div class="fa-desconto-topo">
              <label for="fa-desconto-range">Avisar quando o total ficar abaixo da média de 7 dias em</label>
              <output class="fa-desconto-valor" data-desconto-valor for="fa-desconto-range">15 %</output>
            </div>
            <input id="fa-desconto-range" class="faixa" type="range" name="desconto_pct" min="1" max="50" step="1" value="15">
            <div class="faixa-marcas" aria-hidden="true"><span>1 % · mais avisos</span><span>menos avisos · <span data-desconto-max>50 %</span></span></div>
            <p class="fa-dica" data-desconto-exemplo></p>
          </div>
          <fieldset class="fa-intervalo">
            <legend>Pesquisar a cada</legend>
            <div class="pilulas pilulas-soltas" data-intervalos></div>
            <input type="hidden" name="intervalo_min" value="30">
            <p class="fa-dica">A primeira pesquisa sai logo depois de salvar; as seguintes seguem este intervalo.</p>
          </fieldset>
          <div class="fa-extras">
            <label class="fa-nome">
              <span class="rotulo">Nome do alerta <span class="opcional">(opcional)</span></span>
              <input name="nome" maxlength="40" placeholder="Ex.: Férias em Lisboa">
            </label>
            <label class="interruptor">
              <input type="checkbox" name="ativo" role="switch" checked>
              <span class="interruptor-trilho" aria-hidden="true"></span>
              <span>Alerta ligado</span>
            </label>
          </div>
        </section>
      </div>

      <aside class="fa-resumo" aria-label="Resumo do alerta">
        <div class="fa-resumo-card">
          <p class="fa-resumo-titulo">Resumo</p>
          <div class="fa-trajeto">
            <div class="fa-ponta"><strong data-r="origem">—</strong><span data-r="origem-cidade">Origem</span></div>
            <div class="fa-linha" aria-hidden="true">
              <svg><use href="#i-aviao"/></svg>
            </div>
            <div class="fa-ponta fim"><strong data-r="destino">—</strong><span data-r="destino-cidade">Destino</span></div>
          </div>
          <dl class="fa-itens">
            <div><dt>Viagem</dt><dd data-r="viagem">—</dd></div>
            <div><dt>Datas</dt><dd data-r="datas">—</dd></div>
            <div data-r-duracao hidden><dt>Duração</dt><dd data-r="duracao"></dd></div>
            <div><dt>Aviso</dt><dd data-r="aviso">—</dd></div>
            <div><dt>Pesquisa</dt><dd data-r="pesquisa">—</dd></div>
          </dl>
          <p class="fa-resumo-nota">1 adulto · classe econômica · preços em reais. Trocar rota, datas ou escalas começa uma média nova.</p>
        </div>
        <div class="fa-acao">
          <p class="fa-acao-curta" data-r="curto" aria-hidden="true"></p>
          <button type="submit" class="btn primario grande" data-salvar>Criar alerta</button>
          <a class="btn fantasma" data-cancelar href="/passagens">Cancelar</a>
          <span class="msg" data-msg role="status"></span>
        </div>
      </aside>
    </form>
  </template>

  <!-- Campo de aeroporto com busca (origem e destino) -->
  <template id="t-campo-aeroporto">
    <label class="rotulo" data-rotulo></label>
    <div class="combo">

            <div class="fa-ponta"><strong data-b="origem">—</strong><span data-b="origem-cidade"></span></div>

          <div><dt>Ida</dt><dd data-b="ida">—</dd></div>
          <div><dt>Volta</dt><dd data-b="volta">—</dd></div>
          <div><dt>Voos</dt><dd data-b="voos">—</dd></div>
          <div><dt>Aviso</dt><dd data-b="aviso">—</dd></div>
          <div><dt>Pesquisa</dt><dd data-b="pesquisa">—</dd></div>

      <div class="det-acoes">

        <button class="btn" data-ligar></button>
        <a class="btn" data-duplicar title="Novo alerta com esta rota e estas regras, para mudar datas ou destino"><svg class="ic"><use href="#i-copiar"/></svg>Duplicar</a>

      <div class="kpis">
        <div class="kpi"><span class="kpi-icone"><svg><use href="#i-relogio"/></svg></span><span class="rotulo">Última consulta</span><strong data-k="ultima">—</strong><span class="detalhe" data-k="ultima-det"></span></div>
        <div class="kpi"><span class="kpi-icone"><svg><use href="#i-tendencia"/></svg></span><span class="rotulo">Média móvel 7 dias</span><strong data-k="media">—</strong><span class="detalhe" data-k="media-det"></span></div>
        <div class="kpi destaque"><span class="kpi-icone"><svg><use href="#i-alvo"/></svg></span><span class="rotulo">Gatilho do aviso</span><strong data-k="gatilho">—</strong><span class="detalhe" data-k="gatilho-det"></span></div>
        <div class="kpi"><span class="kpi-icone"><svg><use href="#i-trofeu"/></svg></span><span class="rotulo">Menor total já visto</span><strong data-k="minimo">—</strong><span class="detalhe" data-k="minimo-det"></span></div>
      </div>

      <div class="painel">
        <div class="painel-topo">
          <h2 data-titulo-grafico>Total</h2>
          <div class="pilulas" data-periodo role="group" aria-label="Período do gráfico">
            <button type="button" data-dias="3">3 d</button>
            <button type="button" data-dias="7">7 d</button>
            <button type="button" data-dias="30" class="ativo">30 d</button>
            <button type="button" data-dias="365">Tudo</button>
          </div>
        </div>
        <div class="grafico"><canvas></canvas></div>
        <p class="vazio" data-grafico-vazio hidden>Ainda não há consultas. A primeira sai em poucos minutos.</p>
      </div>

      <div class="duas">
        <div class="painel"><h2>Mais barato agora</h2><div data-voos></div></div>
        <div class="painel"><h2>Sites pesquisados</h2><div data-fontes></div></div>
      </div>

      <div class="secao-titulo"><h2>Editar alerta</h2><p class="sub">Trocar rota, datas ou escalas começa uma média nova.</p></div>
      <div data-form-lugar></div>

      <div class="painel perigo">
        <div class="perigo-linha">
          <div><h2>Apagar alerta</h2><p class="nota">Apaga o alerta e todo o histórico de consultas dele.</p></div>
          <button class="btn perigo" data-apagar><svg class="ic"><use href="#i-lixo"/></svg>Apagar alerta</button>
        </div>
      </div>
    </section>
  </template>

  <!-- Administração (só admin) -->
  <template id="t-admin">
    <section class="conteudo">
      <div class="topo"><div><h1>Administração</h1><p class="sub">Serviço de pesquisa, sites, alertas e contas. Página e dados só para administradores.</p></div></div>
      <div class="abas pilulas" role="tablist" aria-label="Seções da administração">
        <button type="button" role="tab" data-aba="geral" aria-selected="true">Visão geral</button>
        <button type="button" role="tab" data-aba="fontes" aria-selected="false">Sites <span class="aba-n" data-n="fontes"></span></button>
        <button type="button" role="tab" data-aba="alertas" aria-selected="false">Alertas ligados <span class="aba-n" data-n="alertas"></span></button>
        <button type="button" role="tab" data-aba="usuarios" aria-selected="false">Usuários <span class="aba-n" data-n="usuarios"></span></button>
        <button type="button" role="tab" data-aba="empregos" aria-selected="false">Empregos <span class="aba-n" data-n="empregos"></span></button>
      </div>
      <section class="painel operacao" role="tabpanel" data-painel="geral" data-operacao></section>
      <section role="tabpanel" data-painel="fontes" hidden>
        <p class="nota adm-nota">A chave vale na hora para todos os alertas e fica gravada (sobrevive a reinício). Ligar um site ou trocar a saída zera a pausa por falhas. Só aparecem como opção os proxies configurados no serviço.</p>
        <div class="adm-fontes" data-fontes-lista></div>
      </section>
      <section class="painel" role="tabpanel" data-painel="alertas" hidden>
        <div class="painel-topo"><h2>Alertas ligados</h2><p class="nota">Ligados e com a ida por vir: são os que estão sendo pesquisados.</p></div>
        <div data-alertas-lista></div>
      </section>
      <section class="painel" role="tabpanel" data-painel="usuarios" hidden>
        <div class="painel-topo"><h2>Usuários</h2><p class="nota">Mais recentes primeiro.</p></div>
        <div data-usuarios-lista></div>
      </section>
      <section class="emp-adm" role="tabpanel" data-painel="empregos" hidden>
        <div class="painel" data-emp-adm-resumo>
          <div class="painel-topo"><h2>Empregos</h2><p class="nota">Buscas de vagas e concursos: coletas a cada 3 h entre 07:00 e 22:00.</p></div>
          <div class="op-numeros" data-emp-adm-numeros></div>
        </div>
        <div class="painel">
          <div class="painel-topo"><h2>Vagas novas por fonte</h2><p class="nota">Últimos 14 dias.</p></div>
          <div class="grafico emp-grafico"><canvas></canvas></div>
          <p class="vazio" data-emp-adm-grafico-vazio hidden>Ainda não há coletas nos últimos 14 dias.</p>
        </div>
        <div class="painel">
          <div class="painel-topo"><h2>Fontes</h2><p class="nota">Fonte desligada fica fora das próximas coletas de todas as buscas.</p></div>
          <div class="adm-fontes" data-emp-adm-fontes></div>
        </div>
        <div class="painel">
          <div class="painel-topo"><h2>Buscas</h2><p class="nota">Todas as buscas, de todos os usuários.</p></div>
          <div data-emp-adm-buscas></div>
        </div>
        <div class="painel">
          <div class="painel-topo"><h2>Coletas recentes</h2><p class="nota">Últimas 50, mais recentes primeiro.</p></div>
          <div data-emp-adm-coletas></div>
        </div>
        <div class="painel">
          <div class="painel-topo"><h2>Envios recentes</h2><p class="nota">Últimas 50 mensagens no WhatsApp.</p></div>
          <div data-emp-adm-envios></div>
        </div>
      </section>
    </section>
  </template>

  <!-- Empregos: lista de buscas -->
  <template id="t-empregos">
    <section class="conteudo">
      <div class="topo">
        <div>
          <h1>Minhas buscas de emprego</h1>
          <p class="sub" data-limite></p>
        </div>
        <div class="emp-topo-acao" data-nova-lugar></div>
      </div>
      <p class="emp-aviso" data-aviso-limite hidden></p>
      <div class="lista emp-lista" data-lista></div>
    </section>
  </template>

  <!-- Empregos: formulário de busca (nova e edição): só o escopo da coleta -->
  <template id="t-emp-form">
    <section class="conteudo emp-estreito">
      <div class="novo-cabeca">
        <p class="voltar"><a href="/empregos" data-voltar><svg class="ic"><use href="#i-seta"/></svg>Minhas buscas</a></p>
        <h1 data-titulo>Nova busca</h1>
        <p class="sub">A busca define o que coletar: onde e qual profissão. Os filtros de modelo, contrato e salário ficam na página de resultados; os critérios do aviso no WhatsApp, em Alertas.</p>
      </div>
      <form class="emp-form" data-form="busca" novalidate>
        <section class="fa-bloco" aria-labelledby="emp-b2">
          <header class="fa-bloco-topo"><span class="fa-passo" aria-hidden="true">1</span><h2 id="emp-b2">Onde procurar</h2></header>
          <div class="emp-opcoes" role="radiogroup" aria-labelledby="emp-b2">
            <label class="emp-opcao"><input type="radio" name="abrangencia" value="brasil"><span class="emp-opcao-corpo"><strong>Brasil inteiro</strong><small>Qualquer cidade, presencial ou remoto. Ideal para quem procura remoto.</small></span></label>
            <label class="emp-opcao"><input type="radio" name="abrangencia" value="cidades" checked><span class="emp-opcao-corpo"><strong>Cidades específicas</strong><small>Até 3 cidades, com a opção de incluir remotas.</small></span></label>
          </div>
          <div class="emp-onde-cidades" data-onde-cidades>
            <div class="emp-cidades" data-cidades></div>
            <div class="linha-botao"><button type="button" class="btn pequeno" data-mais-cidade><svg class="ic"><use href="#i-mais"/></svg>Adicionar cidade</button><span class="nota" data-cidades-nota>Até 3 cidades.</span></div>
            <p class="erro" data-erro-cidades role="alert"></p>
            <label class="interruptor"><input type="checkbox" name="aceita_remoto" role="switch"><span class="interruptor-trilho" aria-hidden="true"></span><span>Incluir vagas remotas de qualquer lugar</span></label>
          </div>
        </section>

        <section class="fa-bloco" aria-labelledby="emp-b1">
          <header class="fa-bloco-topo"><span class="fa-passo" aria-hidden="true">2</span><h2 id="emp-b1">Profissão</h2></header>
          <label class="campo"><span class="rotulo">Profissão ou cargo</span><input name="profissao" maxlength="80" placeholder="Ex.: Fonoaudióloga" required autocomplete="off"></label>
          <div class="emp-campo">
            <span class="rotulo" id="emp-termos-rotulo">Termos no título da vaga</span>
            <div data-chips="termos"></div>
            <p class="fa-dica" data-termos-dica>A vaga entra quando o título contém algum destes termos (sem diferença de acento ou maiúscula). Ao sair do campo de profissão, os termos são sugeridos; dá para tirar e acrescentar.</p>
          </div>
        </section>

        <section class="fa-bloco" aria-labelledby="emp-b3">
          <header class="fa-bloco-topo"><span class="fa-passo" aria-hidden="true">3</span><h2 id="emp-b3">Coleta</h2></header>
          <label class="interruptor"><input type="checkbox" name="concursos" role="switch"><span class="interruptor-trilho" aria-hidden="true"></span><span>Incluir concursos com o cargo (nas UFs das cidades ou, com Brasil inteiro, de todo o país)</span></label>
          <label class="interruptor"><input type="checkbox" name="ativa" role="switch" checked><span class="interruptor-trilho" aria-hidden="true"></span><span>Busca ligada</span></label>
          <p class="fa-dica">Busca ligada é coletada a cada 3 h, entre 07:00 e 22:00. Todas as vagas com algum termo no título, nas cidades escolhidas, aparecem nos resultados.</p>
        </section>

        <div class="emp-form-acoes">
          <button type="submit" class="btn primario grande" data-salvar>Criar busca</button>
          <a class="btn fantasma" href="/empregos" data-cancelar>Cancelar</a>
          <span class="msg" data-msg role="status"></span>
        </div>
      </form>
      <div class="painel perigo" data-apagar-lugar hidden>
        <div class="perigo-linha">
          <div><h2>Apagar busca</h2><p class="nota">Apaga a busca, o alerta e a lista de vagas encontradas para ela.</p></div>
          <button type="button" class="btn perigo" data-apagar><svg class="ic"><use href="#i-lixo"/></svg>Apagar busca</button>
        </div>
      </div>
    </section>
  </template>

  <!-- Empregos: alerta no WhatsApp de uma busca -->
  <template id="t-emp-alerta">
    <section class="conteudo emp-estreito">
      <div class="novo-cabeca">
        <p class="voltar"><a href="/empregos" data-voltar><svg class="ic"><use href="#i-seta"/></svg>Resultados da busca</a></p>
        <h1 data-titulo>Alerta no WhatsApp</h1>
        <p class="sub" data-sub>Só as vagas novas que atendem a estes critérios chegam no WhatsApp. Os resultados da busca continuam completos na página.</p>
      </div>
      <form class="emp-form" data-form="alerta-emp" novalidate>
        <section class="fa-bloco emp-alerta-liga">
          <label class="interruptor"><input type="checkbox" name="ligado" role="switch"><span class="interruptor-trilho" aria-hidden="true"></span><span><strong>Alerta ligado</strong></span></label>
          <p class="fa-dica" data-estado-alerta></p>
        </section>

        <section class="fa-bloco" aria-labelledby="emp-a1">
          <header class="fa-bloco-topo"><span class="fa-passo" aria-hidden="true">1</span><h2 id="emp-a1">Quais vagas</h2></header>
          <fieldset class="emp-grupo">
            <legend class="rotulo">Modelo de trabalho <span class="opcional">(nenhum marcado = qualquer)</span></legend>
            <div class="pilulas pilulas-soltas" data-multi="modelo"></div>
          </fieldset>
          <fieldset class="emp-grupo">
            <legend class="rotulo">Contrato <span class="opcional">(nenhum marcado = qualquer)</span></legend>
            <div class="pilulas pilulas-soltas" data-multi="contrato"></div>
          </fieldset>
          <label class="campo emp-salario"><span class="rotulo">Salário mínimo por mês <span class="opcional">(opcional)</span></span><input name="salario_minimo" inputmode="numeric" autocomplete="off" placeholder="Sem mínimo"></label>
          <label class="interruptor"><input type="checkbox" name="incluir_sem_salario" role="switch" checked><span class="interruptor-trilho" aria-hidden="true"></span><span>Incluir vagas sem salário informado</span></label>
          <div class="emp-campo">
            <span class="rotulo" id="emp-excluir-rotulo">Palavras que descartam a vaga <span class="opcional">(opcional)</span></span>
            <div data-chips="excluir"></div>
            <p class="fa-dica">Título com qualquer uma destas palavras não gera aviso. Ex.: estágio, coordenador.</p>
          </div>
          <fieldset class="emp-grupo" data-fontes-grupo>
            <legend class="rotulo">Fontes <span class="opcional">(nenhuma marcada = todas)</span></legend>
            <div class="pilulas pilulas-soltas" data-multi="fontes"></div>
          </fieldset>
          <label class="interruptor"><input type="checkbox" name="concursos" role="switch"><span class="interruptor-trilho" aria-hidden="true"></span><span>Avisar também de concursos</span></label>
        </section>

        <section class="fa-bloco" aria-labelledby="emp-a2">
          <header class="fa-bloco-topo"><span class="fa-passo" aria-hidden="true">2</span><h2 id="emp-a2">Quando</h2></header>
          <div class="emp-horario">
            <label><span class="rotulo">A partir de</span><select name="horario_ini" data-hora></select></label>
            <label><span class="rotulo">Até</span><select name="horario_fim" data-hora></select></label>
          </div>
          <p class="fa-dica">Fora do horário os avisos se acumulam e saem na abertura seguinte. Até 5 vagas por mensagem e no máximo 6 mensagens por dia; o resto fica nos resultados.</p>
        </section>

        <div class="emp-form-acoes">
          <button type="submit" class="btn primario grande" data-salvar>Salvar alerta</button>
          <button type="button" class="btn" data-testar><svg class="ic"><use href="#i-zap"/></svg>Enviar teste agora</button>
          <span class="msg" data-msg role="status"></span>
        </div>
        <p class="fa-dica" data-testar-dica>O teste manda agora uma mensagem com até 5 vagas que atendem aos critérios salvos.</p>
      </form>
    </section>
  </template>

  <!-- Empregos: resultados de uma busca, com filtros aplicados no servidor -->
  <template id="t-emp-achados">
    <section class="conteudo">
      <p class="voltar"><a href="/empregos"><svg class="ic"><use href="#i-seta"/></svg>Minhas buscas</a></p>
      <div class="emp-cabeca painel" data-cabeca></div>
      <div class="emp-filtros">
        <div class="pilulas" role="group" aria-label="Situação das vagas" data-filtro>
          <button type="button" data-f="novos">Novos <span class="aba-n" data-n-status="novos"></span></button>
          <button type="button" data-f="todos">Todos <span class="aba-n" data-n-status="todos"></span></button>
          <button type="button" data-f="favoritos">Favoritos <span class="aba-n" data-n-status="favoritos"></span></button>
          <button type="button" data-f="arquivados">Arquivados <span class="aba-n" data-n-status="arquivados"></span></button>
        </div>
        <div class="emp-total"><strong data-total></strong><button type="button" class="link" data-limpar hidden>Limpar filtros</button></div>
        <p class="emp-aviso-acao" data-aviso role="status"></p>
      </div>
      <details class="painel emp-barra" data-barra>
        <summary><span>Filtros</span><span class="aba-n" data-n-filtros></span></summary>
        <div class="emp-barra-grade">
          <label class="emp-barra-texto"><span class="rotulo">Texto</span><input type="search" name="q" placeholder="Título, empregador ou descrição" autocomplete="off" maxlength="80"></label>
          <label><span class="rotulo">UF</span><select name="uf" data-uf></select></label>
          <label><span class="rotulo">Ordenar por</span><select name="ordenar">
            <option value="recentes">Mais recentes</option>
            <option value="salario">Maior salário</option>
            <option value="empregador">Empregador (A–Z)</option>
          </select></label>
          <fieldset class="emp-grupo emp-barra-largo"><legend class="rotulo">Modelo</legend><div class="pilulas pilulas-soltas" data-faceta="modelo"></div></fieldset>
          <fieldset class="emp-grupo emp-barra-largo"><legend class="rotulo">Contrato</legend><div class="pilulas pilulas-soltas" data-faceta="contrato"></div></fieldset>
          <fieldset class="emp-grupo emp-barra-largo"><legend class="rotulo">Fonte</legend><div class="pilulas pilulas-soltas" data-faceta="fonte"></div></fieldset>
          <fieldset class="emp-grupo emp-barra-largo"><legend class="rotulo">Publicadas</legend>
            <div class="pilulas pilulas-soltas" data-dias>
              <label><input type="radio" name="dias" value=""><span>Qualquer data</span></label>
              <label><input type="radio" name="dias" value="7"><span>7 dias</span></label>
              <label><input type="radio" name="dias" value="15"><span>15 dias</span></label>
              <label><input type="radio" name="dias" value="30"><span>30 dias</span></label>
              <label><input type="radio" name="dias" value="45"><span>45 dias</span></label>
            </div>
          </fieldset>
          <div class="emp-barra-salario emp-barra-largo">
            <label class="campo emp-salario"><span class="rotulo">Salário mínimo por mês</span><input name="salario_min" inputmode="numeric" autocomplete="off" placeholder="Sem mínimo"></label>
            <label class="interruptor"><input type="checkbox" name="sem_salario" role="switch" checked><span class="interruptor-trilho" aria-hidden="true"></span><span>Incluir sem salário informado <span class="emp-conta" data-conta-sem></span></span></label>
          </div>
        </div>
      </details>
      <div class="emp-achados" data-achados></div>
      <div class="emp-mais"><button type="button" class="btn" data-mais hidden>Carregar mais</button></div>
    </section>
  </template>
