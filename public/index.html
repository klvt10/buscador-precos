<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Buscador de Passagens</title>
  <link rel="stylesheet" href="style.css?v=35c1f54cdf">
</head>
<body>
  <header class="barra" id="barra" hidden>
    <a href="#/alertas" class="marca">✈️ Buscador de Passagens</a>
    <nav>
      <a href="#/alertas">Alertas</a>
      <a href="#/conta" id="link-conta">Conta</a>
      <button class="btn fantasma" id="btn-sair">Sair</button>
    </nav>
  </header>

  <main id="tela" aria-live="polite"></main>

  <!-- Telas de acesso -->
  <template id="t-entrar">
    <section class="acesso">
      <form class="card form-acesso" data-form="entrar">
        <h1>Entrar</h1>
        <label>Celular (WhatsApp) <input name="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(51) 99999-9999" required></label>
        <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
        <label class="check"><input type="checkbox" name="lembrar" checked> Lembrar este aparelho por 30 dias</label>
        <button class="btn primario" type="submit">Entrar</button>
        <p class="erro" data-erro role="alert"></p>
        <p class="links"><a href="#/esqueci">Esqueci a senha</a> · <a href="#/cadastro">Criar conta</a></p>
      </form>
    </section>
  </template>

  <template id="t-cadastro">
    <section class="acesso">
      <form class="card form-acesso" data-form="cadastro">
        <h1>Criar conta</h1>
        <p class="nota">Um código chega no seu WhatsApp para confirmar o número. Os alertas de preço também chegam por lá.</p>
        <label>Nome <input name="nome" autocomplete="name" maxlength="60" required></label>
        <label>Celular (WhatsApp) <input name="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(51) 99999-9999" required></label>
        <label>Senha (mín. 8 caracteres) <input name="senha" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn primario" type="submit">Criar conta</button>
        <p class="erro" data-erro role="alert"></p>
        <p class="links">Já tem conta? <a href="#/entrar">Entrar</a></p>
      </form>
    </section>
  </template>

  <template id="t-codigo">
    <section class="acesso">
      <form class="card form-acesso" data-form="codigo">
        <h1>Código do WhatsApp</h1>
        <p class="nota">Enviado para <strong data-tel></strong>. Vale por 10 minutos.</p>
        <label>Código de 6 dígitos <input name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="\d{6}" maxlength="6" required></label>
        <label data-nova-senha hidden>Senha nova (mín. 8 caracteres) <input name="senha" type="password" autocomplete="new-password" minlength="8"></label>
        <button class="btn primario" type="submit">Confirmar</button>
        <p class="erro" data-erro role="alert"></p>
        <p class="links"><button type="button" class="link" data-reenviar>Reenviar código</button> · <a href="#/entrar">Voltar</a></p>
      </form>
    </section>
  </template>

  <template id="t-esqueci">
    <section class="acesso">
      <form class="card form-acesso" data-form="esqueci">
        <h1>Esqueci a senha</h1>
        <p class="nota">Se houver conta com este número, um código chega no WhatsApp para criar uma senha nova.</p>
        <label>Celular (WhatsApp) <input name="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(51) 99999-9999" required></label>
        <button class="btn primario" type="submit">Enviar código</button>
        <p class="erro" data-erro role="alert"></p>
        <p class="links"><a href="#/entrar">Voltar</a></p>
      </form>
    </section>
  </template>

  <!-- Lista de alertas -->
  <template id="t-alertas">
    <section class="conteudo">
      <div class="topo">
        <div>
          <h1>Meus alertas</h1>
          <p class="sub" data-limite></p>
        </div>
        <a class="btn primario" href="#/novo" data-novo>Novo alerta</a>
      </div>
      <div class="lista" data-lista></div>
    </section>
  </template>

  <!-- Formulário de alerta (novo e edição) -->
  <template id="t-form-alerta">
    <form class="form-alerta" data-form="alerta" novalidate>
      <div class="fa-principal">

        <section class="fa-bloco" aria-labelledby="fa-rota">
          <header class="fa-bloco-topo">
            <span class="fa-passo" aria-hidden="true">1</span>
            <h2 id="fa-rota" data-titulo>Rota</h2>
          </header>
          <div class="fa-opcoes">
            <div class="pilulas" role="radiogroup" aria-label="Tipo de viagem">
              <label><input type="radio" name="tipo" value="ida-volta" checked><span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>Ida e volta</span></label>
              <label><input type="radio" name="tipo" value="so-ida"><span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13l-4-4M18 12l-4 4"/></svg>Só ida</span></label>
            </div>
            <div class="pilulas" role="radiogroup" aria-label="Escalas">
              <label><input type="radio" name="voos" value="diretos" checked><span>Só diretos</span></label>
              <label><input type="radio" name="voos" value="escalas"><span>Com escalas</span></label>
            </div>
          </div>
          <div class="rota">
            <div class="campo-aeroporto" data-aeroporto="origem"></div>
            <button type="button" class="trocar" data-trocar aria-label="Inverter origem e destino" title="Inverter origem e destino">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v14l-3-3M17 20V6l3 3"/></svg>
            </button>
            <div class="campo-aeroporto" data-aeroporto="destino"></div>
          </div>
          <p class="fa-dica" data-dica-voos>Só voos sem escala. Em rotas longas ou internacionais, “Com escalas” costuma achar preço (e às vezes o único voo).</p>
        </section>

        <section class="fa-bloco" aria-labelledby="fa-datas">
          <header class="fa-bloco-topo">
            <span class="fa-passo" aria-hidden="true">2</span>
            <h2 id="fa-datas">Datas</h2>
            <span class="fa-selo" data-noites hidden></span>
          </header>
          <div class="datas">
            <label class="campo-data">
              <span class="rotulo">Ida</span>
              <input type="date" name="data_ida" required>
              <span class="campo-data-dia" data-dia="ida"></span>
            </label>
            <label class="campo-data" data-volta>
              <span class="rotulo">Volta</span>
              <input type="date" name="data_volta">
              <span class="campo-data-dia" data-dia="volta"></span>
            </label>
          </div>
        </section>

        <section class="fa-bloco" aria-labelledby="fa-aviso">
          <header class="fa-bloco-topo">
            <span class="fa-passo" aria-hidden="true">3</span>
            <h2 id="fa-aviso">Aviso no WhatsApp</h2>
          </header>
          <div class="fa-desconto">
            <div class="fa-desconto-topo">
              <label for="fa-desconto-range">Avisar quando o total ficar abaixo da média de 7 dias em</label>
              <output class="fa-desconto-valor" data-desconto-valor for="fa-desconto-range">15 %</output>
            </div>
            <input id="fa-desconto-range" class="faixa" type="range" name="desconto_pct" min="1" max="50" step="1" value="15">
            <div class="faixa-marcas" aria-hidden="true"><span>1 % · mais avisos</span><span>menos avisos · <span data-desconto-max>50 %</span></span></div>
            <p class="fa-dica" data-desconto-exemplo></p>
          </div>
          <fieldset class="fa-intervalo">
            <legend>Pesquisar a cada</legend>
            <div class="pilulas pilulas-soltas" data-intervalos></div>
            <input type="hidden" name="intervalo_min" value="30">
            <p class="fa-dica">Sites com proteção antirrobô são consultados no máximo a cada 30 minutos.</p>
          </fieldset>
          <div class="fa-extras">
            <label class="fa-nome">
              <span class="rotulo">Nome do alerta <span class="opcional">(opcional)</span></span>
              <input name="nome" maxlength="40" placeholder="Ex.: Férias em Lisboa">
            </label>
            <label class="interruptor">
              <input type="checkbox" name="ativo" role="switch" checked>
              <span class="interruptor-trilho" aria-hidden="true"></span>
              <span>Alerta ligado</span>
            </label>
          </div>
        </section>
      </div>

      <aside class="fa-resumo" aria-label="Resumo do alerta">
        <div class="fa-resumo-card">
          <p class="fa-resumo-titulo">Resumo</p>
          <div class="fa-trajeto">
            <div class="fa-ponta"><strong data-r="origem">—</strong><span data-r="origem-cidade">Origem</span></div>
            <div class="fa-linha" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M2.5 19h19M3.4 13.6l2.8.7 2.3-1.3-5.8-4.4 1.4-.8 7.9 3 4.6-2.6c.9-.5 2-.2 2.5.7.5.9.2 2-.7 2.5L6 18.3 2 14.4z"/></svg>
            </div>
            <div class="fa-ponta fim"><strong data-r="destino">—</strong><span data-r="destino-cidade">Destino</span></div>
          </div>
          <dl class="fa-itens">
            <div><dt>Viagem</dt><dd data-r="viagem">—</dd></div>
            <div><dt>Datas</dt><dd data-r="datas">—</dd></div>
            <div data-r-duracao hidden><dt>Duração</dt><dd data-r="duracao"></dd></div>
            <div><dt>Aviso</dt><dd data-r="aviso">—</dd></div>
            <div><dt>Pesquisa</dt><dd data-r="pesquisa">—</dd></div>
          </dl>
          <p class="fa-resumo-nota">1 adulto · classe econômica · preços em reais. Trocar rota, datas ou escalas começa uma média nova.</p>
        </div>
        <div class="fa-acao">
          <p class="fa-acao-curta" data-r="curto" aria-hidden="true"></p>
          <button type="submit" class="btn primario grande" data-salvar>Criar alerta</button>
          <a class="btn fantasma" data-cancelar href="#/alertas">Cancelar</a>
          <span class="msg" data-msg role="status"></span>
        </div>
      </aside>
    </form>
  </template>

  <!-- Campo de aeroporto com busca (origem e destino) -->
  <template id="t-campo-aeroporto">
    <label class="rotulo" data-rotulo></label>
    <div class="combo">
      <input class="combo-entrada" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false"
             autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Cidade, aeroporto, país ou código">
      <span class="combo-codigo" data-codigo hidden></span>
      <ul class="combo-lista" role="listbox" hidden></ul>
    </div>
    <p class="combo-detalhe" data-detalhe></p>
    <input type="hidden" data-valor>
  </template>

  <!-- Detalhe de um alerta -->
  <template id="t-detalhe">
    <section class="conteudo">
      <div class="topo">
        <div>
          <p class="sub"><a href="#/alertas">← Meus alertas</a></p>
          <h1 data-titulo>—</h1>
          <p class="sub" data-sub></p>
        </div>
        <div class="acoes">
          <button class="btn" data-pesquisar>Pesquisar agora</button>
          <a class="btn" data-duplicar title="Novo alerta com esta rota e estas regras, para mudar datas ou destino">Duplicar</a>
          <button class="btn" data-ligar></button>
        </div>
      </div>

      <div class="kpis">
        <div class="card kpi"><span class="rotulo">Última consulta</span><strong data-k="ultima">—</strong><span class="detalhe" data-k="ultima-det"></span></div>
        <div class="card kpi"><span class="rotulo">Média móvel 7 dias</span><strong data-k="media">—</strong><span class="detalhe" data-k="media-det"></span></div>
        <div class="card kpi"><span class="rotulo">Gatilho do alerta</span><strong data-k="gatilho">—</strong><span class="detalhe" data-k="gatilho-det"></span></div>
        <div class="card kpi"><span class="rotulo">Menor total já visto</span><strong data-k="minimo">—</strong><span class="detalhe" data-k="minimo-det"></span></div>
      </div>

      <div class="card">
        <div class="card-topo">
          <h2 data-titulo-grafico>Total</h2>
          <div class="segmentado" data-periodo>
            <button data-dias="3">3 d</button>
            <button data-dias="7">7 d</button>
            <button data-dias="30" class="ativo">30 d</button>
            <button data-dias="365">Tudo</button>
          </div>
        </div>
        <div class="grafico"><canvas></canvas></div>
        <p class="vazio" data-grafico-vazio hidden>Ainda não há consultas. A primeira sai em poucos minutos.</p>
      </div>

      <div class="duas">
        <div class="card"><h2>Mais barato agora</h2><div data-voos></div></div>
        <div class="card"><h2>Fontes</h2><div data-fontes></div></div>
      </div>

      <div data-form-lugar></div>

      <div class="card perigo">
        <h2>Apagar alerta</h2>
        <p class="nota">Apaga o alerta e todo o histórico de consultas dele.</p>
        <button class="btn perigo" data-apagar>Apagar alerta</button>
      </div>
    </section>
  </template>

  <!-- Conta -->
  <template id="t-conta">
    <section class="conteudo estreito">
      <h1>Conta</h1>
      <form class="card" data-form="nome">
        <h2>Dados</h2>
        <label>Nome <input name="nome" maxlength="60" required></label>
        <p class="nota">Celular: <strong data-tel></strong></p>
        <div class="linha-botao"><button class="btn primario" type="submit">Salvar</button><span class="msg" data-msg></span></div>
      </form>
      <form class="card" data-form="senha">
        <h2>Trocar senha</h2>
        <label>Senha atual <input name="atual" type="password" autocomplete="current-password" required></label>
        <label>Senha nova (mín. 8 caracteres) <input name="nova" type="password" autocomplete="new-password" minlength="8" required></label>
        <div class="linha-botao"><button class="btn primario" type="submit">Trocar</button><span class="msg" data-msg></span></div>
      </form>
      <div class="card">
        <h2>Sessões</h2>
        <p class="nota">Sai deste e de todos os outros aparelhos. O próximo acesso pede código no WhatsApp.</p>
        <button class="btn" data-sair-todos>Sair de todos os aparelhos</button>
      </div>
      <div class="card" data-admin hidden>
        <h2>Operação</h2>
        <pre class="estado" data-estado></pre>
      </div>
      <form class="card perigo" data-form="apagar">
        <h2>Apagar conta</h2>
        <p class="nota">Apaga a conta, os alertas e o histórico. Não tem volta.</p>
        <label>Senha <input name="senha" type="password" autocomplete="current-password" required></label>
        <div class="linha-botao"><button class="btn perigo" type="submit">Apagar conta</button><span class="msg" data-msg></span></div>
      </form>
    </section>
  </template>

  <script src="vendor/chart.umd.min.js?v=cb55581410"></script>
  <script src="vendor/chartjs-adapter-date-fns.bundle.min.js?v=94fb6f22cc"></script>
  <script src="app.js?v=96b1707ae6"></script>
</body>
</html>
